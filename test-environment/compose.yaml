name: needle-test

services:
  lidarr:
    image: ${LIDARR_IMAGE:-ghcr.io/linuxserver-labs/prarr@sha256:106b3bec92f4372d123b437cc8d9115375eaba2d9974756ef83ca569952f1ac0}
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: Etc/UTC
    volumes:
      - ./state/lidarr:/config
      - ./state/staging:/data/staging
      - ./state/downloads:/downloads
      - ./state/music:/music:ro
    ports:
      - "127.0.0.1:8686:8686"
    restart: unless-stopped

  slskd:
    image: ${SLSKD_IMAGE:-slskd/slskd@sha256:ecd4026d4f8fb504e2cc55323efa2c1f5b56d20d3686b018249cc36b48ea17a6}
    init: true
    user: "1000:1000"
    environment:
      SLSKD_SLSK_USERNAME: ${NEEDLE_TEST_SLSK_USERNAME:-needle-test-offline}
      SLSKD_SLSK_PASSWORD: ${NEEDLE_TEST_SLSK_PASSWORD:-needle-test-offline}
    volumes:
      - ./state/slskd:/app
      - ./state/downloads:/downloads
      - ./state/incomplete:/incomplete
      - ./state/music:/sharing:ro
    ports:
      - "127.0.0.1:5030:5030"
      - "127.0.0.1:50300:50300"
    restart: unless-stopped

  beets-flask:
    image: ${BEETS_FLASK_IMAGE:-pspitzner/beets-flask@sha256:98b8b87281e0526f3b9ee517ed1a75da76ae77bfc16564999c5e72d413d1ec50}
    init: true
    environment:
      TZ: Etc/UTC
      USER_ID: "1000"
      GROUP_ID: "1000"
    volumes:
      - ./state/beets:/config
      - ./state/downloads:/music_path/inbox
      - ./state/testing:/music_path/testing
      - ./state/music:/music/imported
      - ./state/logs:/logs
    ports:
      - "127.0.0.1:5001:5001"
    restart: unless-stopped

  jellyfin:
    image: ${JELLYFIN_IMAGE:-jellyfin/jellyfin@sha256:aefb67e6a7ff1debdd154a78a7bbb780fd0c873d8639210a7f6a2016ad2b35db}
    init: true
    environment:
      JELLYFIN_EnableMetrics: "true"
    volumes:
      - ./state/jellyfin/config:/config
      - ./state/jellyfin/cache:/cache
      - ./state/music:/music:ro
    ports:
      - "127.0.0.1:8096:8096"
    restart: unless-stopped

  needle:
    build:
      context: ..
    init: true
    env_file:
      - runtime.env
    environment:
      NODE_ENV: production
      PORT: "8787"
      MUSIC_LIBRARY_PATH: /music
      NEEDLE_DATABASE_PATH: /data/needle.sqlite
      LIDARR_URL: http://lidarr:8686
      LIDARR_API_KEY: needle-test-lidarr-api-key
      LIDARR_PATH_MAPPINGS: '[{"id":"slsk-downloads","providerPrefix":"/downloads","needlePrefix":"/music_path/inbox"}]'
      SLSKD_URL: http://slskd:5030
      SLSKD_API_KEY: needle-test-slskd-api-key
      SLSKD_DOWNLOADS_ROOT: /downloads
      SLSKD_PATH_MAPPINGS: '[{"id":"slskd-downloads","providerPrefix":"/downloads","needlePrefix":"/music_path/inbox"}]'
      BEETS_URL: http://beets-flask:5001
      JELLYFIN_URL: http://jellyfin:8096
      TZ: Etc/UTC
    volumes:
      - ./state/music:/music:ro
      - ./state/needle:/data
    ports:
      - "127.0.0.1:${PORT:-8787}:8787"
    depends_on:
      - lidarr
      - slskd
      - beets-flask
      - jellyfin
    restart: unless-stopped
