name: Native

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test the macOS app
    runs-on: macos
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build and test in an ephemeral VM
        run: ./scripts/ci-native.sh "$PWD"
