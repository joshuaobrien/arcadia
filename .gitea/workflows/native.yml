name: Native

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: Include the normal main Release artifact for a matched benchmark
        type: boolean
        default: false

concurrency:
  group: native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, build and test the macOS app
    runs-on: macos
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Restore upstream Xcode cache (debug)
        uses: irgaly/xcode-cache@282e57619a58eb57a2374be91df1798d46703bfd
        with:
          key: arcadia-established-v1-xcode26-5-mac-debug-${{ hashFiles('Gemfile.lock', 'fastlane/Fastfile', 'Arcadia/**/Package.resolved', 'Arcadia/Arcadia.xcodeproj/project.pbxproj') }}-${{ github.sha }}
          restore-keys: arcadia-established-v1-xcode26-5-mac-debug-${{ hashFiles('Gemfile.lock', 'fastlane/Fastfile', 'Arcadia/**/Package.resolved', 'Arcadia/Arcadia.xcodeproj/project.pbxproj') }}-
          deriveddata-directory: .ci-derived/debug
          sourcepackages-directory: .ci-derived/debug/SourcePackages
          swiftpm-package-resolved-file: Arcadia/Arcadia.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved
          swiftpm-cache-key: arcadia-established-sourcepackages-${{ hashFiles('Arcadia/Arcadia.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-mtime-targets: |
            Arcadia/**/*
            !**/xcuserdata/**

      - name: Restore upstream Xcode cache (release)
        if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || inputs.release == true
        uses: irgaly/xcode-cache@282e57619a58eb57a2374be91df1798d46703bfd
        with:
          key: arcadia-established-v1-xcode26-5-mac-release-${{ hashFiles('Gemfile.lock', 'fastlane/Fastfile', 'Arcadia/**/Package.resolved', 'Arcadia/Arcadia.xcodeproj/project.pbxproj') }}-${{ github.sha }}
          restore-keys: arcadia-established-v1-xcode26-5-mac-release-${{ hashFiles('Gemfile.lock', 'fastlane/Fastfile', 'Arcadia/**/Package.resolved', 'Arcadia/Arcadia.xcodeproj/project.pbxproj') }}-
          deriveddata-directory: .ci-derived/release
          sourcepackages-directory: .ci-derived/release/SourcePackages
          swiftpm-package-resolved-file: Arcadia/Arcadia.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved
          swiftpm-cache-key: arcadia-established-sourcepackages-${{ hashFiles('Arcadia/Arcadia.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-mtime-targets: |
            Arcadia/**/*
            !**/xcuserdata/**

      - name: Check CI worker command behavior
        run: |
          python3 -m unittest discover -s scripts/native_ci -p 'test_*.py'
          node --test scripts/test-auto-merge.mjs scripts/test-publish-macos-update.mjs
          python3 -m unittest discover -s scripts -p test_pr_screenshots.py
          python3 -m unittest discover -s scripts -p test_xctest_publication.py
          python3 -m unittest discover -s scripts -p test_sign_release.py

      - name: Lint, build and test in an ephemeral VM
        env:
          ARCADIA_CI_TOKEN: ${{ github.token }}
          ARCADIA_CI_DERIVED_DIR: ${{ github.workspace }}/.ci-derived
          ARCADIA_BASE_URL: ${{ vars.ARCADIA_BASE_URL }}
          ARCADIA_MACOS_SIGNING: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && secrets.ARCADIA_MACOS_SIGNING || '' }}
        run: |
          export ARCADIA_BUILD_NUMBER=$(git rev-list --first-parent --count HEAD)
          if { [ "$GITHUB_EVENT_NAME" = "push" ] && [ "$GITHUB_REF" = "refs/heads/main" ]; } || [ "${{ inputs.release }}" = "true" ]; then
            if [ "$GITHUB_EVENT_NAME" = "push" ] && [ "$GITHUB_REF" = "refs/heads/main" ]; then
              export ARCADIA_REQUIRE_STABLE_SIGNING=1
            fi
            ARTIFACT_DIR="$PWD/artifacts" ./scripts/ci-native.sh "$PWD"
          else
            ./scripts/ci-native.sh "$PWD"
          fi

      - name: Publish signed macOS update
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          ARCADIA_UPDATE_TOKEN: ${{ secrets.AGENTCONNECT_MERGE_TOKEN }}
          ARCADIA_UPDATE_KEY: ${{ secrets.ARCADIA_SPARKLE_PRIVATE_KEY }}
        run: |
          ./scripts/publish-macos-update artifacts/Arcadia.zip "$GITHUB_SHA" "$(git rev-list --first-parent --count HEAD)"

      - name: Upload macOS app
        timeout-minutes: 2
        if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || inputs.release == true
        uses: actions/upload-artifact@v3
        with:
          name: Arcadia-${{ github.sha }}
          path: artifacts/Arcadia.zip
          if-no-files-found: error
          retention-days: 30

      - name: Upload CI lifecycle evidence
        if: always() && !cancelled()
        timeout-minutes: 2
        uses: actions/upload-artifact@v3
        with:
          name: native-mac-ci-${{ github.sha }}
          path: |
            artifacts/**/*.json
            artifacts/**/*.log
            artifacts/**/*.xml
          if-no-files-found: error
          retention-days: 14
