name: Agent PR merge queue

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

jobs:
  queue:
    if: github.event.pull_request.user.login == 'arcadia-pilot-bot'
    runs-on: docker
    steps:
      # No checkout and no PR code execution: this only calls the Gitea API.
      - name: Mark ready and queue behind required checks
        env:
          MERGE_TOKEN: ${{ secrets.AGENTCONNECT_MERGE_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EVENT_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          node <<'JS'
          const base = 'https://joshs-mac-mini.tail81f644.ts.net/api/v1/repos/jj/arcadia';
          async function api(path, method = 'GET', data) {
            const response = await fetch(base + path, {
              method,
              headers: { Authorization: `token ${process.env.MERGE_TOKEN}`, 'Content-Type': 'application/json' },
              body: data === undefined ? undefined : JSON.stringify(data),
              signal: AbortSignal.timeout(30000),
            });
            const body = await response.text();
            const result = body ? JSON.parse(body) : null;
            // Gitea returns 409 for a duplicate schedule; that is already the desired state.
            const scheduled = /^pull request is already scheduled to auto merge when checks succeed \[pull_id: \d+\]$/;
            if (response.status === 409 && method === 'POST' && path.endsWith('/merge') && scheduled.test(result?.message ?? '')) {
              return { alreadyQueued: true };
            }
            if (!response.ok) throw new Error(`Gitea ${method} ${path}: HTTP ${response.status}`);
            return result;
          }
          let authorisedQueue = false;
          async function main() {
            if (!process.env.MERGE_TOKEN) throw new Error('Missing merge token');
            const number = process.env.PR_NUMBER;
            if (!/^[1-9][0-9]*$/.test(number)) throw new Error('Invalid PR number');
            const path = `/pulls/${number}`;
            const pr = await api(path);
            if (pr.state !== 'open' || pr.merged) return;
            if (pr.user.login !== 'arcadia-pilot-bot' || pr.base.ref !== 'main' || pr.head.repo.full_name !== 'jj/arcadia') {
              throw new Error('PR is outside the authorised bot/repository/base boundary');
            }
            if (pr.head.sha !== process.env.EVENT_HEAD) {
              console.log('Superseded event; latest head event owns the queue request');
              return;
            }
            authorisedQueue = true;
            // Inspect trusted Gitea metadata only; never check out or execute PR code.
            let visual = false;
            for (let page = 1; ; page++) {
              if (page > 100) throw new Error('PR file inventory exceeds evidence-check bound');
              const files = await api(path + `/files?limit=100&page=${page}`);
              if (!Array.isArray(files)) throw new Error('Invalid PR file inventory');
              const ui = /^Arcadia\/Arcadia\/.*\.swift$|^Arcadia\/Arcadia\/.*\.xcassets\//;
              visual ||= files.some(file => ui.test(file.filename) || ui.test(file.previous_filename ?? ''));
              if (files.length < 100) break;
            }
            if (visual) {
              const marker = /<!-- arcadia-visual-evidence:v1\n([\s\S]*?)\n-->/g;
              const manifests = [...(pr.body ?? '').matchAll(marker)];
              if (manifests.length !== 1) throw new Error('Visual PR requires published before/after screenshots; run scripts/pr-screenshots');
              const evidence = JSON.parse(manifests[0][1]);
              if (evidence.head_sha !== pr.head.sha || !Array.isArray(evidence.pairs) || !evidence.pairs.length || evidence.pairs.length > 20) throw new Error('Missing or stale visual evidence');
              const platforms = evidence.pairs.map(pair => pair.platform).sort();
              if (JSON.stringify(platforms) !== JSON.stringify(['duo', 'iphone', 'mac'])) throw new Error('Native app changes require exactly one Mac, iPhone and Duo comparison');
              const commits = await api(path + '/commits?limit=100');
              if (evidence.before_ref !== pr.merge_base && !commits.some(c => c.sha === evidence.before_ref)) throw new Error('Invalid before-capture baseline');
              async function trees(ref) {
                async function entries(sha) {
                  const result = await api('/git/trees/' + sha);
                  if (result.truncated) throw new Error('Truncated source tree inventory');
                  return Object.fromEntries(result.tree.map(e => [e.path, e]));
                }
                const root = await entries(ref);
                const native = await entries(root.Arcadia.sha);
                const project = await entries(native['Arcadia.xcodeproj'].sha);
                return { app_tree_sha: native.Arcadia.sha, project_sha: project['project.pbxproj'].sha };
              }
              const expected = { before: await trees(evidence.before_ref), after: await trees(pr.head.sha) };
              const assets = await api(`/issues/${number}/assets`);
              const { createHash } = require('node:crypto');
              for (const pair of evidence.pairs) {
                if (!['mac', 'iphone', 'duo'].includes(pair.platform)) throw new Error('Invalid evidence platform');
                if (pair.before?.sha256 === pair.after?.sha256) throw new Error('Before and after must be distinct captures');
                for (const stage of ['before', 'after']) {
                  const image = pair[stage];
                  if (!image || Object.entries(expected[stage]).some(([key, value]) => image[key] !== value)) throw new Error('Capture source does not match declared Git source');
                  const asset = assets.find(a => a.id === image?.asset_id);
                  if (!asset || !/^[0-9a-f-]{36}$/.test(asset.uuid) || !/^[a-f0-9]{64}$/.test(image.sha256 ?? '') || !/^[a-f0-9]{64}$/.test(image.source_sha256 ?? '') || typeof image.run_id !== 'string' || !image.run_id) throw new Error('Invalid screenshot attachment/provenance');
                  const url = `https://joshs-mac-mini.tail81f644.ts.net/attachments/${asset.uuid}`;
                  if (image.url !== url || !(pr.body ?? '').includes(`![${pair.platform} ${stage}](${url})`)) throw new Error('Screenshot is not embedded in the PR');
                  if (!(asset.size > 0 && asset.size <= 10485760)) throw new Error('Screenshot size exceeds bound');
                  const response = await fetch(url, { redirect: 'error', signal: AbortSignal.timeout(30000) });
                  if (!response.ok) throw new Error('Screenshot is inaccessible');
                  const bytes = Buffer.from(await response.arrayBuffer());
                  if (bytes.length > 10485760 || bytes.subarray(0, 8).toString('hex') !== '89504e470d0a1a0a' || createHash('sha256').update(bytes).digest('hex') !== image.sha256) throw new Error('Screenshot content mismatch');
                }
              }
              // Check Gitea's rendered HTML, not Markdown hidden in a comment/code block.
              const rendered = await fetch(`https://joshs-mac-mini.tail81f644.ts.net/jj/arcadia/pulls/${number}`, { redirect: 'error', signal: AbortSignal.timeout(30000) });
              if (!rendered.ok) throw new Error('PR HTML is inaccessible');
              const html = await rendered.text();
              for (const pair of evidence.pairs) for (const stage of ['before', 'after']) {
                const image = pair[stage];
                const tags = html.match(/<img\b[^>]*>/g) ?? [];
                if (!tags.some(tag => tag.includes(`alt="${pair.platform} ${stage}"`) && tag.includes(`/attachments/${image.url.split('/').at(-1)}`))) throw new Error('Screenshot is not rendered visibly in PR HTML');
              }
              // Same-head edits can remove evidence too; reject that race.
              const final = await api(path);
              if (final.head.sha !== pr.head.sha || final.body !== pr.body) throw new Error('PR source or evidence changed during verification');
            }
            if (pr.draft) {
              const title = pr.title.replace(/^(?:WIP:|Draft:|\[WIP\])\s*/i, '');
              const ready = await api(path, 'PATCH', { title });
              if (ready.draft) throw new Error('PR remains draft');
            }
            await api(path + '/merge', 'POST', {
              do: 'squash', head_commit_id: pr.head.sha,
              merge_when_checks_succeed: true, force_merge: false,
            });
            console.log(`PR #${number} queued; required CI and reviewer checks still apply`);
          }
          main().catch(async error => {
            console.error(error.message);
            process.exitCode = 1;
            if (authorisedQueue && process.env.MERGE_TOKEN) {
              try { await api(`/pulls/${process.env.PR_NUMBER}/merge`, 'DELETE'); }
              catch { console.error('Could not clear an existing schedule; required queue status remains failing'); }
            }
          });
          JS
